# 独立 action policy 后训练
# 启动：bash train.sh tasks/train_action_policy.py configs/policy_action/post_train.yaml
# 配置独立维护；更换数据 / 动作组成后需重新计算 configs/norm_compute/ 下的统计。

model:
  # 加载独立预训练导出的完整 action policy。
  action_policy_path: outputs/action_pretrain/checkpoints/global_step_50000/hf_ckpt/action_policy

data:
  # ---- 数据集与机器人映射 ----
  # 多数据集设置 data_name: multi，并指定数据集清单与合并统计；见 docs/data.md。
  data_name: own_robot
  train_path: ../data/bi_rebot_09_pick_and_place_1023-annotated
  robot_config_root: configs/robot_configs
  norm_stats_file: assets/norm_stats/own_robot.json

  # ---- 动作 / 状态特征 ----
  # 双臂 TCP 与夹爪共 20 维。动作向量先左臂、后右臂，每臂按 joints 顺序排列。
  joints:
    # - arm.position: 14
    - end.position: 18
    - effector.position: 2
  norm_type:
    # - arm.position: bounds_99
    - end.position: bounds_99
    - effector.position: minmax

  # spatial_encoder 按左、右顺序接收当前帧的两张 224×224 腕图。
  cameras:
    - camera_wrist_left
    - camera_wrist_right

  # ---- 数据加载 ----
  video_backend: torchcodec
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

train:
  # ---- 输入长度与动作去噪 ----
  action_dim: 20
  max_action_dim: 20
  max_state_dim: 20
  chunk_size: 50
  num_steps: 5
  loss_type: fm

  # ---- 学习率与优化器 ----
  optimizer: adamw
  fused_optimizer: true
  lr: 1.0e-5 
  action_loss_weight: 1.0
  weight_decay: 0.0
  lr_decay_style: constant

  # ---- 批量、精度与分布式 ----
  # float32：FP32 主参数 / AdamW，BF16 autocast；部署导出 BF16。
  parameter_dtype: float32
  # 每卡 micro batch；显存不足时先减小此值。
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  init_device: cuda
  data_parallel_mode: fsdp2
  enable_full_shard: true
  module_fsdp_enable: true
  enable_gradient_checkpointing: true
  rmpad: false
  rmpad_with_pos_ids: false
  use_compile: false

  # ---- 训练时长、保存与日志 ----
  output_dir: outputs/action_posttrain
  max_steps: 4000
  save_steps: 1000
  save_epochs: 11111
  enable_resume: false
  use_wandb: false

  # ---- RTC：由 enabled 控制 delay 在 [0, max_delay_steps] 均匀采样 ----
  rtc_training:
    enabled: true
    delay_sampling: uniform
    max_delay_steps: 8
